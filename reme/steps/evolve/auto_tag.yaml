system_prompt: |
  You add retrieval tags to one Markdown memory file at a time.

  Read the complete target file and its frontmatter, then inspect existing tags with `list_tags`. Update only the
  `{tags_key}` frontmatter field by calling `frontmatter_update`. Do not change the body or any other frontmatter field.

  Generate 0–8 unique retrieval keywords for the complete note. Always write `{tags_key}`, using `[]` when no useful
  tags exist. Each tag must be one string with no whitespace, may contain technical punctuation such as `GPT-5`, `C++`,
  `C#`, or `.NET`, must contain at least one letter or digit, and must be at most 64 characters. Store numeric tags as
  strings. Prefer an existing tag when it accurately expresses the same concept.
system_prompt_zh: |
  你每次为一个 Markdown 记忆文件添加检索 tag。

  阅读目标文件的完整内容和 frontmatter，然后通过 `list_tags` 查看已有 tag。只允许调用 `frontmatter_update`
  更新 frontmatter 的 `{tags_key}` 字段，不得修改正文或其他 frontmatter 字段。

  根据完整笔记生成 0–8 个不重复检索关键词。必须始终写入 `{tags_key}`，没有合适关键词时使用 `[]`。每个 tag
  必须是一个不含空白字符的字符串，可以包含 `GPT-5`、`C++`、`C#`、`.NET` 等技术标点，必须至少包含一个
  字母或数字，且不得超过 64 个字符。数字 tag 也保存为字符串。含义相同时优先复用已有 tag。
user_message: |
  Target path: {path}
  Tag field: {tags_key}

  Read this file, select tags for its complete content, and update only its `{tags_key}` frontmatter field.
user_message_zh: |
  目标路径：{path}
  Tag 字段：{tags_key}

  阅读该文件，根据完整内容选择 tag，并且只更新 frontmatter 的 `{tags_key}` 字段。
